<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Annotations_Generator</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000000;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/pick_video_web.loader.js"></script>
    <script>

      var canvas = document.querySelector("#unity-canvas");

      // ------------------------------------------------------------------
      // CHROME DOUBLE-EVENT FIX
      //
      // Chrome fires multiple browser events for one physical click/tap:
      //   pointerdown → mousedown → mouseup → click (synthetic)
      // All of these can reach Unity and fire OnVideoTapped multiple times.
      //
      // We block ALL pointer events on the canvas for 400ms after the
      // first pointerdown. This is done at the JS capture phase (before
      // Unity ever sees the events) so it is 100% reliable.
      //
      // We use pointerdown as the trigger (not click) because:
      // - pointerdown fires first and is the "real" user intent
      // - All subsequent events (mouseup, click) within 400ms are duplicates
      // ------------------------------------------------------------------
      var blockUntil = 0;
      var BLOCK_MS   = 400;

      // Intercept ALL pointer-related events in capture phase
      ['pointerdown', 'mousedown', 'mouseup', 'click', 'touchstart', 'touchend'].forEach(function(eventName) {
        canvas.addEventListener(eventName, function(e) {
          var now = Date.now();

          if (eventName === 'pointerdown' || eventName === 'touchstart') {
            // This is the FIRST real event — allow it through and block rest
            if (now >= blockUntil) {
              blockUntil = now + BLOCK_MS; // block next 400ms of events
              // Allow this first event through to Unity normally
            } else {
              // A pointerdown inside the block window = duplicate, kill it
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          } else {
            // mousedown, mouseup, click, touchend — always block if in window
            if (now < blockUntil) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }
        }, true); // capture phase = intercept before Unity
      });

      // ------------------------------------------------------------------
      // devicePixelRatio: 1
      //
      // Using dpr=2 on Retina/HiDPI screens makes Unity's coordinate system
      // misalign with the CSS layout. This causes:
      //   - Bounding box spawning in the wrong position
      //   - Input events hitting wrong areas
      // Set to 1 for correct input. Sharp text is less important than
      // correct tap behaviour for this annotation tool.
      // ------------------------------------------------------------------
      createUnityInstance(canvas, {
        dataUrl:            "Build/pick_video_web.data.unityweb",
        frameworkUrl:       "Build/pick_video_web.framework.js.unityweb",
        codeUrl:            "Build/pick_video_web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "Annotations_Generator",
        productVersion:     "0.1",
        devicePixelRatio:   1,
      }).then((unityInstance) => {
        // loaded
      }).catch((message) => {
        alert(message);
      });

    </script>
  </body>
</html>
