<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Annotations_Generator</title>
    <style>
      html, body { 
          width: 100%; height: 100%; margin: 0; padding: 0; 
          overflow: hidden; background-color: #000;
          /* 🔥 FIX: Prevents the "Double-Tap to Zoom" gesture on mobile Chrome */
          touch-action: manipulation; 
      }
      #unity-canvas { 
          width: 100% !important; height: 100% !important; 
          position: absolute; top: 0; left: 0; display: block;
          /* 🔥 FIX: Prevents blue tap highlight box */
          -webkit-tap-highlight-color: rgba(0,0,0,0);
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/webgl build.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // 🔥 FIX: Capping DPR strictly to prevent memory-related random stops
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      createUnityInstance(canvas, {
        dataUrl: "Build/webgl build.data.unityweb",
        frameworkUrl: "Build/webgl build.framework.js.unityweb",
        codeUrl: "Build/webgl build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Annotations_Generator",
        productVersion: "0.1",
        devicePixelRatio: dpr, 
      }).then((instance) => {
          canvas.focus();
      });
    </script>
  </body>
</html>
