<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Annotations_Generator</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000000;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/pick_video_web.loader.js"></script>
    <script>

      var canvas = document.querySelector("#unity-canvas");

      // ------------------------------------------------------------------
      // CHROME DOUBLE-EVENT FIX
      //
      // Chrome fires this sequence for ONE physical click:
      //   pointerdown → mousedown → mouseup → click
      // All of these reach Unity and can call OnVideoTapped multiple times.
      //
      // Fix: after the first pointerdown, block ALL further pointer events
      // on the canvas for 500ms. Done at JS capture phase so Unity never
      // sees the duplicates.
      // ------------------------------------------------------------------
      var blockUntil = 0;
      var BLOCK_MS   = 500;

      var eventsToBlock = ['pointerdown','mousedown','mouseup','click','touchstart','touchend','pointerup'];

      eventsToBlock.forEach(function(evtName) {
        canvas.addEventListener(evtName, function(e) {
          var now = Date.now();

          if (evtName === 'pointerdown' || evtName === 'touchstart') {
            if (now >= blockUntil) {
              // First real event — allow through, block everything after
              blockUntil = now + BLOCK_MS;
            } else {
              // Duplicate pointerdown within block window — kill it
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          } else {
            // All follow-up events — block if within window
            if (now < blockUntil) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }
        }, true); // capture phase — before Unity sees it
      });

      // ------------------------------------------------------------------
      // devicePixelRatio: 1
      // Using dpr=2 causes Unity's coordinate system to mismatch with CSS
      // layout on HiDPI screens — taps register in wrong positions and
      // bounding boxes appear in wrong places.
      // ------------------------------------------------------------------
      createUnityInstance(canvas, {
        dataUrl:            "Build/pick_video_web.data.unityweb",
        frameworkUrl:       "Build/pick_video_web.framework.js.unityweb",
        codeUrl:            "Build/pick_video_web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "Annotations_Generator",
        productVersion:     "0.1",
        devicePixelRatio:   1,
      }).then((unityInstance) => {
        // loaded successfully
      }).catch((message) => {
        alert(message);
      });

    </script>
  </body>
</html>
