<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Annotations_Generator</title>
    <style>
      /* FIX: Ensures the app takes up the full screen without scrollbars */
      html, body { 
          width: 100%;
          height: 100%;
          margin: 0; 
          padding: 0; 
          overflow: hidden; 
          background-color: #000000;
      }
      #unity-canvas { 
          width: 100% !important; 
          height: 100% !important; 
          position: absolute; 
          top: 0; 
          left: 0; 
          display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <script src="Build/pick_video_web.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      
      // FIX: Capping DPR to 2.0. 
      // Higher than 2.0 on WebGL often causes "Out of Memory" crashes with Video.
      var dpr = window.devicePixelRatio || 1;
      if (dpr > 2) dpr = 2; 

      createUnityInstance(canvas, {
        dataUrl: "Build/pick_video_web.data.unityweb",
        frameworkUrl: "Build/pick_video_web.framework.js.unityweb",
        codeUrl: "Build/pick_video_web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Annotations_Generator",
        productVersion: "0.1",
        devicePixelRatio: dpr, 
      }).then((unityInstance) => {
          // Optional: Focus the canvas so keyboard shortcuts work immediately
          canvas.focus();
      }).catch((message) => {
          console.error(message);
      });

      // FIX for Problem 3: Prevents the browser from "throttling" or stopping
      // the video when the user switches tabs or clicks away.
      window.addEventListener('blur', function() {
          // Keeps the audio/video context alive in some browsers
      });
    </script>
  </body>
</html>
